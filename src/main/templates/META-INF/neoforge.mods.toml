modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
NeoForge 1.21.1 port of npcpathfinding for CustomNPCs.
Original by XiaoBiniaoX; 1.12.2 port by Ajie Chao Mian.
'''

[[mixins]]
config="mixins.npcpathfindinglegacy.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="customnpcs"
    type="required"
    versionRange="[1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="cnpcplus"
    type="required"
    versionRange="[4.0.5,)"
    ordering="AFTER"
    side="BOTH"
